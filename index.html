:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}

<section id="home"><div class="hwrap">
<h1 class="htitle">תיקון קוראים</h1>
<p class="hsub">לימוד קריאה בתורה: טקסט בלי ניקוד, עם ניקוד ועם טעמים, והקלטות להאזנה.</p>

</div></section>
<script>
